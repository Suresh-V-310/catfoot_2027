<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HackFlow — Hackathon Platform</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6e9ef;--primary:#635bff;--primary2:#4f46e5;--green:#10b981;--red:#ef4444;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#111827;color:white;padding:22px 16px;position:fixed;top:0;bottom:0}.brand{font-size:22px;font-weight:800;padding:8px 10px 25px}.brand span{color:#8b5cf6}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.side-bottom{position:absolute;bottom:18px;left:16px;right:16px}.main{margin-left:245px;width:calc(100% - 245px)}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#ede9fe;color:#5b21b6;display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1400px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.page-title h1{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px #11182708}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:30px;font-weight:800;margin-top:7px}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.btn{padding:10px 15px;border-radius:9px;font-weight:700}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#eef2ff;color:#4338ca}.danger{background:#fee2e2;color:#b91c1c}.success{background:#d1fae5;color:#047857}.small{padding:7px 10px;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:600}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.purple{background:#ede9fe;color:#6d28d9}.green{background:#d1fae5;color:#047857}.yellow{background:#fef3c7;color:#92400e}.blue{background:#dbeafe;color:#1d4ed8}.red{background:#fee2e2;color:#b91c1c}.hero{background:linear-gradient(135deg,#312e81,#635bff);color:white;padding:26px;border-radius:18px;margin-bottom:20px}.hero h2{margin:0 0 7px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#11182799;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-box{background:white;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #d8dce5;border-radius:9px;outline:none}.form textarea{min-height:100px;resize:vertical}.empty{padding:40px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#4338ca)}.login-card{width:min(450px,92%);background:#fff;border-radius:20px;padding:32px}.role-tabs{display:flex;gap:8px;margin:12px 0}.role-tabs button{flex:1;padding:9px;border-radius:8px;background:#f3f4f6}.role-tabs button.active{background:#ede9fe;color:#5b21b6;font-weight:700}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px}.chart{display:flex;align-items:end;height:170px;gap:12px;padding:15px 0}.bar{flex:1;background:#c4b5fd;border-radius:6px 6px 0 0;min-height:12px;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}.rank{font-size:18px;font-weight:800}.hide{display:none!important}@media(max-width:900px){.sidebar{width:70px}.brand{font-size:0}.brand span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{margin-left:70px;width:calc(100% - 70px)}.stats,.three,.two{grid-template-columns:1fr 1fr}}@media(max-width:620px){.content{padding:16px}.stats,.three,.two{grid-template-columns:1fr}.topbar{padding:0 15px}.page-title{align-items:flex-start;gap:10px}.page-title h1{font-size:22px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const seed={
 users:[{id:1,name:"Alex Organizer",email:"organizer@hackflow.local",role:"organizer"},{id:2,name:"Priya Participant",email:"participant@hackflow.local",role:"participant"},{id:3,name:"Judge Kumar",email:"judge@hackflow.local",role:"judge"}],
 events:[{id:1,name:"Dogfood 2026",slug:"dogfood-2026",status:"Published",start:"2026-09-25",end:"2026-09-28",description:"Build the platform that will judge you.",tracks:["Open Track"],prizes:["₹80,000","₹50,000","₹35,000"]}],
 teams:[{id:1,name:"Cloud Ninjas",members:["Priya Participant"],eventId:1}],
 submissions:[{id:1,team:"Cloud Ninjas",project:"JudgeFlow",track:"Open Track",status:"Submitted",repo:"https://github.com/example/judgeflow",eventId:1,created:"2026-09-27"}],
 judges:[{id:1,name:"Judge Kumar",assigned:[1]}],
 scores:[{submissionId:1,judgeId:1,innovation:8,technical:9,impact:8,design:7}],
 audit:[{time:"Today 10:20",actor:"Alex Organizer",action:"Published Dogfood 2026"}],
 gallery:[{submissionId:1,votes:12,comments:3}]
};
let db=JSON.parse(localStorage.getItem("hackflow-db")||JSON.stringify(seed));
let session=JSON.parse(localStorage.getItem("hackflow-session")||"null");
let page="dashboard";
function save(){localStorage.setItem("hackflow-db",JSON.stringify(db));localStorage.setItem("hackflow-session",JSON.stringify(session))}
function esc(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function avg(s){let a=["innovation","technical","impact","design"].map(k=>Number(s[k]||0));return a.reduce((x,y)=>x+y,0)/a.length}
function totalScore(id){let ss=db.scores.filter(s=>s.submissionId===id);if(!ss.length)return 0;return ss.reduce((a,s)=>a+avg(s),0)/ss.length}
function audit(action,resource="Platform",status="Success"){db.audit.unshift({time:new Date().toLocaleString(),actor:session?session.name:"System",action,resource,status});save()}
function openModal(html){modal.classList.add("open");modalBox.innerHTML=html}
function closeModal(){modal.classList.remove("open")}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()})
function login(){
 document.getElementById("root").innerHTML=`<div class="login"><div class="login-card"><div class="brand" style="padding:0 0 12px;color:#111827">Hack<span>Flow</span></div><h1>Welcome back</h1><p class="muted">Local demo account — no network required.</p><div class="role-tabs"><button class="active" onclick="setRole(this,'organizer')">Organizer</button><button onclick="setRole(this,'participant')">Participant</button><button onclick="setRole(this,'judge')">Judge</button></div><form class="form" onsubmit="doLogin(event)"><input id="email" value="organizer@hackflow.local" required><input id="password" type="password" value="demo123" required><button class="btn primary">Sign in</button></form><div class="notice" style="margin-top:14px">Demo credentials are pre-seeded. Choose a role above.</div></div></div>`;
}
let selectedRole="organizer";
function setRole(btn,role){document.querySelectorAll(".role-tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");selectedRole=role;document.getElementById("email").value=role+"@hackflow.local"}
function doLogin(e){e.preventDefault();session=db.users.find(u=>u.role===selectedRole);save();render()}
function logout(){session=null;save();login()}
const routeMap={dashboard:"/dashboard",hackathons:"/hackathons",submissions:"/submissions",judging:"/judging",leaderboard:"/leaderboard",gallery:"/gallery",teams:"/teams","audit-log":"/audit-log"};
const pageLabels={dashboard:"Dashboard",hackathons:"Hackathons",submissions:"Submissions",judging:"Judging",leaderboard:"Leaderboard",gallery:"Public Gallery",teams:"Teams","audit-log":"Audit Log"};
function parseRoute(){const raw=(location.hash||location.pathname||"#/dashboard").replace(/^#/,"");const clean=(raw.startsWith("/")?raw:"/"+raw).replace(/^\/+/,"").split("/").filter(Boolean)[0]||"dashboard";const path=clean.toLowerCase();if(!path||path==="index.html"||path==="d:"||path==="c:"||path==="e:"||path==="f:")return"dashboard";const alias={events:"hackathons",audit:"audit-log"};return alias[path]||path||"dashboard"}
function nav(p){page=p;location.hash=routeMap[p]||"/"+p;render()}
window.addEventListener("hashchange",()=>{page=parseRoute();render()});
window.addEventListener("popstate",()=>{page=parseRoute();render()});
function shell(content){
const navs=[["dashboard","▦ Dashboard"],["hackathons","◫ Hackathons"],["submissions","⌁ Submissions"],["judging","★ Judging"],["leaderboard","♛ Leaderboard"],["gallery","◉ Public Gallery"],["teams","♟ Teams"],["audit-log","◌ Audit Log"]];
return `<div class="app"><aside class="sidebar"><div class="brand">Hack<span>Flow</span></div><div class="nav">${navs.map(([p,t])=>`<button class="${page===p?"active":""}" onclick="nav('${p}')">${t}</button>`).join("")}</div><div class="side-bottom"><button class="nav" style="width:100%;background:#1f2937;color:#cbd5e1;padding:11px;border-radius:9px" onclick="logout()">↪ Sign out</button></div></aside><main class="main"><header class="topbar"><strong>${(pageLabels[page]||page).replace(/^./,m=>m.toUpperCase())}</strong><div class="user"><span class="muted">${esc(session.name)} · ${esc(session.role)}</span><div class="avatar">${esc(session.name[0])}</div></div></header><section class="content">${content}</section></main></div>`
}
function dashboard(){
let e=db.events[0], sub=db.submissions.length, judged=db.scores.length, teams=db.teams.length;
return `<div class="hero"><h2>${esc(e.name)}</h2><div>${esc(e.description)}</div><div style="margin-top:16px;display:flex;gap:20px;flex-wrap:wrap"><span>📅 ${e.start} → ${e.end}</span><span>🏆 ${e.prizes.join(" · ")}</span><span>● ${e.status}</span></div></div>
<div class="grid stats"><div class="card"><div class="stat-label">Participants / teams</div><div class="stat-value">${teams}</div></div><div class="card"><div class="stat-label">Submissions</div><div class="stat-value">${sub}</div></div><div class="card"><div class="stat-label">Judged</div><div class="stat-value">${judged}</div></div><div class="card"><div class="stat-label">Completion</div><div class="stat-value">${sub?Math.round(judged/sub*100):0}%</div></div></div>
<div class="grid two" style="margin-top:18px"><div class="card"><div class="row"><h3>Lifecycle</h3><span class="badge green">T1 + T2 MVP</span></div>${["Registration","Team formation","Submission","Judge assignment","Scoring","Normalization","Results"].map((x,i)=>`<div style="margin:14px 0"><div class="row"><span>${i+1}. ${x}</span><span>${i<6?"✓":"→"}</span></div><div class="progress" style="margin-top:7px"><i style="width:${i<6?100:65}%"></i></div></div>`).join("")}</div>
<div class="card"><div class="row"><h3>Score distribution</h3><span class="muted">0–10</span></div><div class="chart">${[5,7,8,9,10,8,6].map((v,i)=>`<div class="bar" style="height:${v*12}px"><span>${v}</span></div>`).join("")}</div></div></div>`
}
function events(){
const list=db.events.map(e=>{
 let participants=Array.from(new Set(db.teams.filter(t=>t.eventId===e.id).flatMap(t=>t.members))).length;
 let teamsCount=db.teams.filter(t=>t.eventId===e.id).length;
 let submissionCount=db.submissions.filter(s=>s.eventId===e.id).length;
 return `<div class="card"><div class="row"><span class="badge green">${e.status}</span><b>${e.start} → ${e.end}</b></div><h2>${esc(e.name)}</h2><p class="muted">${esc(e.description)}</p><p><b>Date:</b> ${esc(e.start)} → ${esc(e.end)}</p><p><b>Prize Pool:</b> ${esc(e.prizes.join(" · "))}</p><p><b>Status:</b> ${esc(e.status)}</p><div class="row muted"><span>Participants: ${participants}</span><span>Teams: ${teamsCount}</span><span>Submissions: ${submissionCount}</span></div><div class="actions">${session.role==="organizer"?`<button class="btn secondary small" onclick="eventForm(${e.id})">Edit</button><button class="btn primary small" onclick="publishEvent(${e.id})">Publish</button>`:""}<button class="btn small" onclick="openEvent(${e.id})">View details</button></div></div>`
}).join("");
return `<div class="page-title"><div><h1>Hackathons</h1><div class="muted">Create and configure events, tracks, dates and prizes.</div></div>${session.role==="organizer"?`<button class="btn primary" onclick="eventForm()">+ Create hackathon</button>`:""}</div><div class="grid two">${list||"<div class='card'><p>No hackathons found.</p></div>"}</div>`
}
function eventForm(id=0){
let e=db.events.find(x=>x.id===id)||{name:"",start:"",end:"",description:"",tracks:["Open Track"],prizes:["₹80,000","₹50,000","₹35,000"]};
openModal(`<h2>${id?"Edit":"Create"} Hackathon</h2><form class="form" onsubmit="saveEvent(event,${id})"><label>Name<input id="en" value="${esc(e.name)}" required></label><label>Start date<input id="es" type="date" value="${e.start}" required></label><label>End date<input id="ee" type="date" value="${e.end}" required></label><label>Description<textarea id="ed">${esc(e.description)}</textarea></label><label>Track<input id="et" value="${esc(e.tracks[0])}"></label><label>Prizes (comma separated)<input id="ep" value="${esc(e.prizes.join(","))}"></label><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save hackathon</button></div></form>`)
}
function saveEvent(ev,id){ev.preventDefault();let x={id:id||Date.now(),name:en.value,start:es.value,end:ee.value,description:ed.value,tracks:[et.value],prizes:ep.value.split(",").map(x=>x.trim()),status:"Draft"};if(id)db.events=db.events.map(e=>e.id===id?x:e);else db.events.push(x);audit((id?"Updated":"Created")+" hackathon "+x.name,"Hackathon","Success");closeModal();render()}
function publishEvent(id){let e=db.events.find(x=>x.id===id);e.status="Published";audit("Published "+e.name,"Hackathon","Success");save();render()}
function openEvent(id){
 let e=db.events.find(x=>x.id===id);
 if(!e){return}
 let participants=Array.from(new Set(db.teams.filter(t=>t.eventId===e.id).flatMap(t=>t.members))).length;
 let teamCount=db.teams.filter(t=>t.eventId===e.id).length;
 let submissionCount=db.submissions.filter(s=>s.eventId===e.id).length;
 openModal(`<div class="row"><h2>${esc(e.name)}</h2><span class="badge green">${esc(e.status)}</span></div><p class="muted">${esc(e.description)}</p><div class="grid two" style="margin-top:16px"><div class="card"><p><b>Date:</b> ${esc(e.start)} → ${esc(e.end)}</p><p><b>Prize Pool:</b> ${esc(e.prizes.join(" · "))}</p><p><b>Status:</b> ${esc(e.status)}</p></div><div class="card"><p><b>Participants:</b> ${participants}</p><p><b>Teams:</b> ${teamCount}</p><p><b>Submissions:</b> ${submissionCount}</p></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="closeModal()">Close</button><button class="btn secondary" onclick="nav('submissions')">View submissions</button></div>`)
}
function submissions(){
const rows=db.submissions.length?db.submissions.map(s=>`<tr><td><b>${esc(s.project)}</b><br><span class="muted">${esc(s.repo)}</span></td><td>${esc(s.team)}</td><td>${esc(s.track)}</td><td><span class="badge ${s.status==="Submitted"?"green":"yellow"}">${s.status}</span></td><td><b>${totalScore(s.id).toFixed(2)}</b>/10</td><td><button class="btn secondary small" onclick="viewSubmission(${s.id})">View</button></td></tr>`).join(""):`<tr><td colspan="6">No submissions available.</td></tr>`;
return `<div class="page-title"><div><h1>Submissions</h1><div class="muted">Projects, repositories, status and judging workflow.</div></div>${session.role==="participant"?`<button class="btn primary" onclick="submissionForm()">+ Submit project</button>`:""}</div><div class="card"><table class="table"><thead><tr><th>Project</th><th>Team</th><th>Track</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`
}
function submissionForm(){
openModal(`<h2>Submit project</h2><form class="form" onsubmit="saveSubmission(event)"><label>Project name<input id="sp" required></label><label>Team<select id="st">${db.teams.map(t=>`<option>${esc(t.name)}</option>`).join("")}</select></label><label>Track<select id="sk"><option>Open Track</option></select></label><label>GitHub Repository URL<input id="sr" placeholder="https://github.com/..." required></label><label>Live Demo URL<input id="sdm" placeholder="https://example.com"></label><label>Project description<textarea id="sd" required></textarea></label><label class="row" style="gap:8px;align-items:center"><input id="spublic" type="checkbox" checked> Publicly visible in gallery</label><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Submit</button></div></form>`)
}
function saveSubmission(ev){ev.preventDefault();let s={id:Date.now(),team:st.value,project:sp.value,track:sk.value,status:"Submitted",repo:sr.value,demo:sdm.value||"",description:sd.value,eventId:1,created:new Date().toISOString().slice(0,10),public:spublic.checked,judgeStatus:"Pending"};db.submissions.push(s);db.gallery.push({submissionId:s.id,votes:0,comments:0});audit("Submission created for "+s.project,"Submission","Success");closeModal();render()}
function viewSubmission(id){
let s=db.submissions.find(x=>x.id===id), score=totalScore(id);
openModal(`<div class="row"><h2>${esc(s.project)}</h2><span class="badge green">${esc(s.status)}</span></div><p><b>Team:</b> ${esc(s.team)}</p><p><b>Track:</b> ${esc(s.track)}</p><p><b>GitHub Repository:</b> <a href="${esc(s.repo)}" target="_blank">Open repository</a></p>${s.demo?`<p><b>Live Demo:</b> <a href="${esc(s.demo)}" target="_blank">Open demo</a></p>`:""}<p>${esc(s.description||"Project submitted to HackFlow.")}</p><div class="card"><b>Current normalized score</b><div style="font-size:32px;font-weight:800">${score.toFixed(2)} / 10</div></div>${session.role==="judge"||session.role==="organizer"?`<button class="btn primary" style="margin-top:12px" onclick="judgeForm(${id})">Score submission</button>`:""} <button class="btn" style="margin-top:12px" onclick="closeModal()">Close</button>`)
}
function judgeForm(id){
let sub=db.submissions.find(x=>x.id===id);
let old=db.scores.find(s=>s.submissionId===id&&s.judgeId===session.id)||{innovation:0,technical:0,impact:0,design:0,comment:""};
openModal(`<h2>Judge submission</h2><form class="form" onsubmit="saveScore(event,${id})"><label>Project<input value="${esc(sub.project)}" readonly></label>${["innovation","technical","impact","design"].map(k=>`<label>${k==="innovation"?"Innovation":k==="technical"?"Technical Implementation":k==="impact"?"Problem Solving":k==="design"?"UI/UX":"Impact"} (0–10)<input id="sc_${k}" type="number" min="0" max="10" step="0.1" value="${old[k]}" oninput="updateJudgementTotal()"></label>`).join("")}<div class="row"><b>Total score</b><span id="score-total">${(((old.innovation||0)+(old.technical||0)+(old.impact||0)+(old.design||0))/4).toFixed(2)}</span> / 10</div><label>Judge comments<textarea id="sc_comment">${esc(old.comment||"")}</textarea></label><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Submit Judgement</button></div></form>`)
updateJudgementTotal();
}
function updateJudgementTotal(){let scores=["innovation","technical","impact","design"].map(k=>Number(document.getElementById("sc_"+k)?.value||0));let total=scores.reduce((a,b)=>a+b,0)/scores.length;let target=document.getElementById("score-total");if(target)target.textContent=Number.isFinite(total)?total.toFixed(2):"0.00"}
function saveScore(ev,id){ev.preventDefault();let payload={submissionId:id,judgeId:session.id,innovation:+sc_innovation.value,technical:+sc_technical.value,impact:+sc_impact.value,design:+sc_design.value,comment:sc_comment.value};db.scores=db.scores.filter(s=>!(s.submissionId===id&&s.judgeId===session.id));db.scores.push(payload);let s=db.submissions.find(x=>x.id===id);if(s){s.status="Judged";s.judgeStatus="Judged";}audit("Judgement submitted for "+(s?s.project:id),"Judgement","Success");closeModal();render()}
function judging(){
if(!db.submissions.length){return `<div class="page-title"><div><h1>Judging</h1><div class="muted">Weighted rubric, judge assignment and normalized scores.</div></div></div><div class="card"><p>No submissions available for judging.</p></div>`}
let isAuthorized=session.role==="judge"||session.role==="organizer";
let rows=db.submissions.map(s=>{let judgeStatus=s.judgeStatus||"Pending";let judgeText=judgeStatus==="Judged"?"Judged":"Pending";return `<tr><td><b>${esc(s.project)}</b></td><td>${esc(s.team)}</td><td><a href="${esc(s.repo)}" target="_blank">${esc(s.repo)}</a></td><td><span class="badge ${s.status==="Judged"?"green":"yellow"}">${esc(s.status||"Submitted")}</span></td><td><span class="badge ${judgeText==="Judged"?"green":"blue"}">${esc(judgeText)}</span></td><td>${isAuthorized?`<button class="btn primary small" onclick="judgeForm(${s.id})">${judgeText==="Judged"?"Review":"Judge"}</button>`:`<span class="muted">Restricted</span>`}</td></tr>`}).join("");
return `<div class="page-title"><div><h1>Judging</h1><div class="muted">Weighted rubric, judge assignment and normalized scores.</div></div></div><div class="grid three"><div class="card"><b>Rubric</b><p>Innovation <b>25%</b></p><p>Technical <b>35%</b></p><p>Problem Solving <b>25%</b></p><p>UI/UX <b>15%</b></p></div><div class="card"><b>Judge assignment</b><p>${db.judges.length} judge(s)</p><p>${db.submissions.length} submission(s)</p><span class="badge blue">Authorized review</span></div><div class="card"><b>Normalization</b><p>Mean score across assigned judges.</p><p class="muted">Judgement submission updates leaderboard.</p></div></div><div class="card" style="margin-top:18px"><table class="table"><thead><tr><th>Project Name</th><th>Team</th><th>GitHub Repository</th><th>Submission Status</th><th>Judge Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`
}
function leaderboard(){
let list=db.submissions.map(s=>({project:s.project,team:s.team,score:totalScore(s.id)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
if(!list.length){return `<div class="page-title"><div><h1>Leaderboard</h1><div class="muted">Scores are calculated from judge evaluations.</div></div></div><div class="card"><p>No leaderboard data available.</p></div>`}
return `<div class="page-title"><div><h1>Leaderboard</h1><div class="muted">Scores are calculated from judge evaluations.</div></div><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div><div class="card"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>Project</th><th>Score</th></tr></thead><tbody>${list.map((s,i)=>`<tr><td>#${i+1}</td><td>${esc(s.team)}</td><td>${esc(s.project)}</td><td><b>${s.score.toFixed(2)}</b></td></tr>`).join("")}</tbody></table></div>`
}
function gallery(){
let items=db.submissions.filter(s=>s.public===true || s.status==="Judged" || s.status==="Published");
if(!items.length){return `<div class="page-title"><div><h1>Public Gallery</h1><div class="muted">Projects that are intentionally shared publicly.</div></div></div><div class="card"><p>No public projects yet.</p></div>`}
return `<div class="page-title"><div><h1>Public Gallery</h1><div class="muted">Projects that are intentionally shared publicly.</div></div></div><div class="grid three">${items.map(s=>{let score=totalScore(s.id);let g=db.gallery.find(x=>x.submissionId===s.id)||{votes:0,comments:0};return `<div class="card"><span class="badge purple">${esc(s.track)}</span><h2>${esc(s.project)}</h2><p class="muted"><b>Team:</b> ${esc(s.team)}</p><p>${esc(s.description||"Project showcase")}</p><div class="row"><span>🧩 ${esc(s.tech||"Full Stack")}</span><span>${score>0?`⭐ ${score.toFixed(2)}`:"No score yet"}</span></div><div class="actions" style="margin-top:12px"><a class="btn secondary small" href="${esc(s.repo)}" target="_blank">Open GitHub</a>${s.demo?`<a class="btn small" href="${esc(s.demo)}" target="_blank">Open Live Demo</a>`:""}</div></div>`}).join("")}</div>`
}
function vote(id){let g=db.gallery.find(x=>x.submissionId===id);if(!g){db.gallery.push({submissionId:id,votes:0,comments:0});g=db.gallery.find(x=>x.submissionId===id)}g.votes++;audit("Community vote on submission #"+id,"Gallery","Success");save();render()}
function teams(){
let myTeam=db.teams.find(t=>t.members.includes(session.name));
let rows=db.teams.map(t=>`<div class="card"><h2>${esc(t.name)}</h2><p><b>Team Leader:</b> ${esc(t.leader||t.members[0])}</p><p><b>Members:</b> ${t.members.map(m=>esc(m)).join(", ")}</p><p><b>Team Size:</b> ${t.members.length} / ${t.maxMembers||4}</p><p><b>College:</b> ${esc(t.college||"Not specified")}</p><div class="actions">${!myTeam||myTeam.id!==t.id?`<button class="btn primary small" onclick="joinTeam(${t.id})">Join Team</button>`:`<button class="btn secondary small" onclick="leaveTeam(${t.id})">Leave Team</button>`}<button class="btn small" onclick="addMemberToTeam(${t.id})">Add Member</button></div></div>`).join("");
return `<div class="page-title"><div><h1>Teams</h1><div class="muted">Team formation and member management.</div></div>${session.role==="participant"?`<button class="btn primary" onclick="teamForm()">+ Create team</button>`:""}</div><div class="card" style="margin-bottom:18px"><h3>My Team</h3>${myTeam?`<p><b>Team:</b> ${esc(myTeam.name)}</p><p><b>Leader:</b> ${esc(myTeam.leader||myTeam.members[0])}</p><p><b>Members:</b> ${myTeam.members.map(m=>esc(m)).join(", ")}</p><p><b>Team Size:</b> ${myTeam.members.length} / ${myTeam.maxMembers||4}</p><p><b>College:</b> ${esc(myTeam.college||"Not specified")}</p>`:`<p>No team yet. Create or join a team to participate.</p>`}</div><div class="grid three">${rows}</div>`
}
function teamForm(){openModal(`<h2>Create team</h2><form class="form" onsubmit="saveTeam(event)"><label>Team name<input id="tn" required></label><label>College<input id="tc" value="${esc(session.college||"")}"></label><label>Team size limit<select id="tm"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><button class="btn primary">Create team</button></form>`)}
function saveTeam(e){e.preventDefault();let name=tn.value.trim();if(!name){return}if(db.teams.some(t=>t.name.toLowerCase()===name.toLowerCase())){alert("Team already exists.");return}db.teams.push({id:Date.now(),name,leader:session.name,members:[session.name],eventId:1,college:tc.value||"Not specified",maxMembers:Number(tm.value)||4});audit("Team created - "+name,"Team","Success");closeModal();render()}
function joinTeam(id){let t=db.teams.find(x=>x.id===id);if(!t)return;if(t.members.length>=(t.maxMembers||4)){alert("Team size limit reached.");return}if(t.members.includes(session.name)){return}t.members.push(session.name);t.leader=t.leader||t.members[0];audit("Member added to team "+t.name,"Team","Success");save();render()}
function leaveTeam(id){let t=db.teams.find(x=>x.id===id);if(!t)return;if(t.members.length===1){db.teams=db.teams.filter(x=>x.id!==id);audit("Left team "+t.name,"Team","Success");}else{t.members=t.members.filter(m=>m!==session.name);if(t.leader===session.name&&t.members.length){t.leader=t.members[0];}audit("Left team "+t.name,"Team","Success");}save();render()}
function addMemberToTeam(id){let t=db.teams.find(x=>x.id===id);if(!t)return;let name=window.prompt("Enter member name to add:");if(!name||!name.trim()){return}if(t.members.length>=(t.maxMembers||4)){alert("Team size limit reached.");return}if(t.members.includes(name.trim())){alert("Member already in the team.");return}t.members.push(name.trim());audit("Member added to team "+t.name,"Team","Success");save();render()}
function auditPage(){let entries=db.audit&&db.audit.length?db.audit:[{time:new Date().toLocaleString(),actor:"System",action:"No audit activity yet",resource:"Platform",status:"Info"}];return `<div class="page-title"><div><h1>Audit Log</h1><div class="muted">Traceable actions across the platform.</div></div></div><div class="card"><table class="table"><thead><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Resource</th><th>Status</th></tr></thead><tbody>${entries.map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.actor||"System")}</td><td>${esc(a.action)}</td><td>${esc(a.resource||"Platform")}</td><td><span class="badge ${a.status==="Success"||a.status==="Published"?"green":a.status==="Info"?"blue":"yellow"}">${esc(a.status||"Success")}</span></td></tr>`).join("")}</tbody></table></div>`}
function exportCSV(){let csv="Rank,Project,Team,Score\\n"+[...db.submissions].sort((a,b)=>totalScore(b.id)-totalScore(a.id)).map((s,i)=>`${i+1},"${s.project}","${s.team}",${totalScore(s.id).toFixed(2)}`).join("\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="hackflow-leaderboard.csv";a.click()}
function render(){if(!session){login();return}let c={dashboard:dashboard,hackathons:events,submissions:submissions,judging:judging,leaderboard:leaderboard,gallery:gallery,teams:teams,"audit-log":auditPage}[page]||dashboard;root.innerHTML=shell(c())}
page=parseRoute();
render();
</script>
</body></html>
